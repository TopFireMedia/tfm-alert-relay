name: Fleet down-check

# Keeps the fleet monitor running on a tight cadence. GitHub's *scheduled* runs
# are far too unreliable for this (observed 1–3.5h between fires on a */5
# schedule), so instead each run STAYS ALIVE and calls /api/monitor every ~2 min
# for ~6 hours. `concurrency` chains runs back-to-back (one active, one queued),
# so coverage is effectively continuous. Free on a public repo.

on:
  schedule:
    - cron: '0 */2 * * *'   # fire often; the queued run takes over when the active one ends
  workflow_dispatch: {}       # manual "start now" from the Actions tab

concurrency:
  group: fleet-monitor
  cancel-in-progress: false   # queue the next run instead of cancelling — keeps the chain going

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Poll the monitor every ~2 minutes for ~6 hours
        run: |
          END=$(( SECONDS + 350*60 ))
          n=0
          while [ $SECONDS -lt $END ]; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 45 https://tfm-alert-relay.vercel.app/api/monitor || echo "000")
            n=$((n+1))
            echo "$(date -u +%H:%M:%S)  tick $n  monitor -> $code"
            sleep 120
          done
          echo "loop complete after $n ticks"
